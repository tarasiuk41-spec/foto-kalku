<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="android-pv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="solar-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="zap-energy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Maskable Safe Background: full 512x512 -->
  <rect width="512" height="512" rx="112" fill="url(#android-pv-bg)" />

  <!-- Solar Circle & Rays (Safe inner circle ~ 80% radius = 400px centered at 256,256) -->
  <g transform="translate(256, 256)">
    <!-- Ambient glow circle -->
    <circle r="150" fill="#10b981" opacity="0.12" filter="url(#glow)" />
    
    <!-- Outer Solar Ring -->
    <circle r="120" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="12 8" />
    
    <!-- PV Panel Grid Shape -->
    <path d="M-80,-20 L80,-20 L105,70 L-105,70 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="4" opacity="0.9" />
    <!-- Grid lines -->
    <line x1="0" y1="-20" x2="0" y2="70" stroke="#60a5fa" stroke-width="3" />
    <line x1="-42" y1="-20" x2="-54" y2="70" stroke="#60a5fa" stroke-width="2.5" />
    <line x1="42" y1="-20" x2="54" y2="70" stroke="#60a5fa" stroke-width="2.5" />
    <line x1="-92" y1="25" x2="92" y2="25" stroke="#60a5fa" stroke-width="2.5" />

    <!-- Radiant Sun Rising Above Panel -->
    <circle cx="0" cy="-60" r="38" fill="url(#solar-sun)" filter="url(#glow)" />
    
    <!-- Sun rays -->
    <path d="M0,-115 L0,-104 M-45,-100 L-37,-92 M45,-100 L37,-92 M-58,-60 L-47,-60 M58,-60 L47,-60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />

    <!-- Dynamic Lightning Bolt Symbol across center -->
    <path d="M8,-50 L-26,5 L5,5 L-12,75 L34,0 L5,0 Z" fill="url(#zap-energy)" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
    
    <!-- Android Robot subtle ear dot accent -->
    <circle cx="-130" cy="-130" r="10" fill="#3ddc84" opacity="0.8" />
    <circle cx="130" cy="-130" r="10" fill="#3ddc84" opacity="0.8" />
  </g>
</svg>
